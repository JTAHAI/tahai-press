name: Bug report
description: Report a reproducible TAHAI Press defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve TAHAI Press. Remove private publication material and credentials before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, branch, or commit hash where the problem occurs.
      placeholder: 1.0.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Build or validation
        - Public templates or styling
        - Pages CMS
        - PDF reader
        - Search or archives
        - Redirects or migration
        - Accessibility
        - Crossword
        - GitHub or Cloudflare workflow
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
      placeholder: |
        1. Start from a clean checkout
        2. Run ...
        3. Open ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Relevant output
      description: Paste sanitized test output, browser console errors, or screenshots. Do not include secrets or private documents.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I tested the current main branch or latest release.
          required: true
        - label: I ran `npm run ci` and included any relevant failure.
          required: true
        - label: I removed credentials and private publication data.
          required: true
