name: Feature proposal
description: Propose a focused improvement aligned with TAHAI Press architecture.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Publishing need
      description: Describe the editorial or operational problem before describing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: static
    attributes:
      label: Static-first fit
      description: Explain how the proposal preserves publisher ownership, accessible static output, and low operational burden.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The proposal does not require a public application database.
          required: true
        - label: The proposal keeps generated output understandable and portable.
          required: true
        - label: Accessibility and no-JavaScript fallbacks were considered where relevant.
          required: true
