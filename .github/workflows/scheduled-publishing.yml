name: Scheduled publishing

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: scheduled-publishing
  cancel-in-progress: false

jobs:
  publish-due:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.commit.outputs.published }}
      release_commit: ${{ steps.commit.outputs.release_commit }}
    steps:
      - name: Check out publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Publish due articles
        run: npm run publish:due -- --write

      - name: Validate changed content
        run: npm run validate

      - name: Commit scheduled publication
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- content/articles; then
            echo "No scheduled articles became due."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles
          git commit -m "publish: release scheduled articles"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-published-content:
    needs: publish-due
    if: needs.publish-due.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out published commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-due.outputs.release_commit }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Build published site
        run: npm run build

      - name: Deploy publication worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy dist --name tahai-press --compatibility-date 2026-09-13 --keep-vars

      - name: Verify deployed publication
        env:
          TAHAI_PRESS_EXPECTED_COMMIT: ${{ needs.publish-due.outputs.release_commit }}
        run: npm run verify:live -- --origin https://tahai-press.tahai.net --expected-commit "$TAHAI_PRESS_EXPECTED_COMMIT"
