name: Export theme release source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate normalized release lockfile
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '2.3.3';
          pkg.dependencies = { ...(pkg.dependencies || {}), sharp: '0.34.1' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.version!=='2.3.3'||p.packages[''].dependencies.sharp!=='0.34.1') process.exit(1)"
      - name: Upload normalized lockfile
        uses: actions/upload-artifact@v4
        with:
          name: tahai-press-normalized-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
