name: Production readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-proof:
    name: Produce deployable main-branch artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLICATION_PRODUCTION_BRANCH: main
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Run clean GA gate
        id: ga
        continue-on-error: true
        run: npm run verify:ga

      - name: Create sanitized GA receipt
        if: steps.ga.outcome == 'success'
        run: npm run ga:receipt

      - name: Create sanitized failure diagnostics
        if: steps.ga.outcome == 'failure'
        run: node scripts/create-ga-failure-diagnostics.mjs

      - name: Write workflow summary
        if: always()
        run: |
          printf '%s\n' '## TAHAI Press proof' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Branch or ref: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- GA outcome: ${{ steps.ga.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- GA command: npm run verify:ga' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable release proof
        if: steps.ga.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tahai-press-production-${{ github.sha }}
          path: |
            dist
            .artifacts/release-proof
            .artifacts/newsroom-health
            .artifacts/media-health.json
            .artifacts/performance-audit.json
            .artifacts/ga-release-receipt.json
            .artifacts/ga-gate-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized failure diagnostics
        if: steps.ga.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tahai-press-ga-failure-${{ github.sha }}
          path: .artifacts/ga-failure-diagnostics.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve GA failure exit status
        if: steps.ga.outcome == 'failure'
        run: exit 1
