name: Apply TAHAI Press v1.8 source update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v1.8-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v1-8-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    name: Replace main with verified v1.8 source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out bootstrap payload
        uses: actions/checkout@v4
        with:
          ref: bootstrap-v1.8
          fetch-depth: 0

      - name: Reassemble and verify source patch
        shell: bash
        run: |
          cat .bootstrap/v18-patch.part-* > /tmp/v18-patch.b64
          base64 --decode /tmp/v18-patch.b64 > /tmp/v18-source.patch.xz
          echo "1e306a75da284728627656d7ff1e765dbb2a2b5e7755bb14a489f43d8dd037d3  /tmp/v18-source.patch.xz" | sha256sum --check -
          xz --decompress --stdout /tmp/v18-source.patch.xz > /tmp/v18-source.patch

      - name: Apply v1.8 to main
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create main origin/main
          git apply --check /tmp/v18-source.patch
          git apply /tmp/v18-source.patch
          rm -f .github/workflows/apply-v1.8-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release TAHAI Press v1.8.0 — Launch Desk"
          git push origin main

      - name: Remove bootstrap branch
        if: success()
        shell: bash
        run: git push origin --delete bootstrap-v1.8
