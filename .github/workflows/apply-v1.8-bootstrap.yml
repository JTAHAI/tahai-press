name: Apply TAHAI Press v2.1 source update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v1.8-bootstrap.yml
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-v2-1-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.head_ref == 'bootstrap-v2.1' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Replace main with verified v2.1 source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified bootstrap payload
        uses: actions/checkout@v4
        with:
          ref: bootstrap-v2.1
          fetch-depth: 0

      - name: Reassemble and verify v1.8 baseline patch
        shell: bash
        run: |
          cat .bootstrap/v18-patch.part-* > /tmp/v18-patch.b64
          base64 --decode /tmp/v18-patch.b64 > /tmp/v18-source.patch.xz
          echo "1e306a75da284728627656d7ff1e765dbb2a2b5e7755bb14a489f43d8dd037d3  /tmp/v18-source.patch.xz" | sha256sum --check -
          xz --decompress --stdout /tmp/v18-source.patch.xz > /tmp/v18-source.patch

      - name: Reassemble and verify v2.1 incremental patch
        shell: bash
        run: |
          cat .bootstrap/v21-patch.part-* > /tmp/v21-patch.b64
          base64 --decode /tmp/v21-patch.b64 > /tmp/v21-source.patch.xz
          echo "471aa1f6ccd41f90792d8662b2c91bc94cd01cf83bdc7955fd19437369387933  /tmp/v21-source.patch.xz" | sha256sum --check -
          xz --decompress --stdout /tmp/v21-source.patch.xz > /tmp/v21-source.patch

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply verified releases and validate
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create main origin/main
          git apply --check /tmp/v18-source.patch
          git apply /tmp/v18-source.patch
          rm -rf .bootstrap .github/workflows/apply-v1.8-bootstrap.yml
          git apply --check /tmp/v21-source.patch
          git apply /tmp/v21-source.patch
          test -f package.json
          test -f public/assets/writer-desk.js
          node -e "const p=require('./package.json'); if(p.name!=='tahai-press'||p.version!=='2.1.0') process.exit(1)"
          for forbidden in node_modules dist .artifacts; do
            test ! -e "$forbidden"
          done
          npm run validate
          npm test

      - name: Publish v2.1 to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release TAHAI Press v2.1.0 — Writer Desk"
          git push origin main

      - name: Remove bootstrap branch
        if: success()
        shell: bash
        run: git push origin --delete bootstrap-v2.1
