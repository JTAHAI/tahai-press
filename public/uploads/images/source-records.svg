  <rect x="180" y="145" width="450" height="570" fill="#d9e8f2" stroke="#123a5a" stroke-width="12" transform="rotate(-8 405 430)"/>
  <rect x="230" y="115" width="450" height="570" fill="#fffdf7" stroke="#123a5a" stroke-width="12" transform="rotate(3 455 400)"/>
  <rect x="285" y="170" width="310" height="34" fill="#123a5a"/>
  <g fill="#345f7f"><rect x="285" y="245" width="300" height="16"/><rect x="285" y="285" width="270" height="16"/><rect x="285" y="325" width="290" height="16"/><rect x="285" y="405" width="245" height="16"/><rect x="285" y="445" width="280" height="16"/><rect x="285" y="525" width="260" height="16"/></g>
