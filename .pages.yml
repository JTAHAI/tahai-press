media:
  - name: images
    label: Images
    input: public/uploads/images
    output: /uploads/images
    rename: safe
    extensions: [avif, gif, jpeg, jpg, png, svg, webp]
    categories: [image]
    commit:
      templates:
        create: "media(image): add {filename}"
        update: "media(image): update {filename}"
        delete: "media(image): remove {filename}"
        rename: "media(image): rename {oldFilename} to {newFilename}"
  - name: documents
    label: PDFs and documents
    input: public/uploads/documents
    output: /uploads/documents
    rename: safe
    extensions: [pdf]
    categories: [document]
    commit:
      templates:
        create: "media(document): add {filename}"
        update: "media(document): update {filename}"
        delete: "media(document): remove {filename}"
        rename: "media(document): rename {oldFilename} to {newFilename}"

components:
  slug:
    type: string
    label: URL slug
    required: true
    description: "Permanent URL text. Use lowercase letters, numbers, and single hyphens. Changing this later changes the public address."
    pattern:
      regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      message: "Use lowercase letters, numbers, and single hyphens only."
    options:
      minlength: 1
      maxlength: 120
  hex_color:
    type: string
    pattern:
      regex: "^#[0-9A-Fa-f]{6}$"
      message: "Use a six-digit hex color such as #17324d."
    options:
      minlength: 7
      maxlength: 7

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: remove {path}"
      rename: "content: rename {oldPath} to {newPath}"

content:
  - name: publishing
    label: Publishing
    type: group
    items:
      - name: articles
        label: Articles
        type: collection
        path: content/articles
        format: json
        subfolders: false
        filename:
          template: "{fields.slug}.json"
          field: false
        view:
          primary: title
          fields: [status, published_at, classification, article_type, author]
          search: [title, slug, excerpt, author, tags]
          sort: [published_at, title, status]
          default:
            sort: published_at
            order: desc
        fields:
          - name: title
            label: Headline
            type: string
            required: true
            description: "The public headline and the name shown in the CMS article list."
            options:
              minlength: 1
              maxlength: 180
          - name: slug
            component: slug
          - name: status
            label: Publishing status
            type: select
            required: true
            default: draft
            description: "Drafts and archived entries stay in Git but do not appear on the public site. Complete the publication checklist before switching to Published."
            options:
              values:
                - name: draft
                  label: Draft — private from the public build
                - name: scheduled
                  label: Scheduled — publishes at the selected date and time
                - name: published
                  label: Published — visible after deployment
                - name: archived
                  label: Archived — retained but not public
          - name: article_type
            label: Article format
            type: select
            required: true
            default: standard
            description: "Choose the format that matches the public page. Format-specific requirements are checked during the build."
            options:
              values:
                - name: standard
                  label: Written article
                - name: pdf
                  label: PDF-first document record
                - name: mixed
                  label: Written article with supporting PDF
                - name: external
                  label: Document hosted on another website
          - name: classification
            label: Editorial classification
            type: select
            required: true
            default: news
            description: "Tell readers what kind of work this is. The label appears beside the headline and on professional section fronts."
            options:
              values:
                - name: news
                  label: News
                - name: analysis
                  label: Analysis
                - name: opinion
                  label: Opinion
                - name: investigation
                  label: Investigation
                - name: public-record
                  label: Public record
                - name: explainer
                  label: Explainer
                - name: interview
                  label: Interview
                - name: announcement
                  label: Announcement
                - name: developing
                  label: Developing coverage
          - name: kicker
            label: Article eyebrow
            type: string
            description: "Optional short label above the headline, such as Public record or Analysis."
            options:
              maxlength: 100
          - name: excerpt
            label: Homepage and archive summary
            type: text
            description: "Required before publishing. Write a plain-language summary between 20 and 360 characters."
            options:
              minlength: 20
              maxlength: 360
          - name: body
            label: Article text or document context
            type: rich-text
            default: ""
            description: "Required for written and mixed articles. Optional context may also accompany a PDF-first or external record. Raw HTML is not published."
            options:
              format: markdown
              switcher: true
              media: images
              rename: safe
              categories: [image]
          - name: story_blocks
            label: Structured newspaper blocks
            type: block
            description: "Optional. Add and reorder professional story elements without writing special Markdown. Every block is checked before publication."
            list:
              max: 30
              collapsible:
                collapsed: true
                summary: "{type} · {heading}"
            blockKey: type
            blocks:
              - name: text
                label: Text section
                fields:
                  - name: heading
                    label: Section heading
                    type: string
                    options:
                      maxlength: 160
                  - name: body
                    label: Section text
                    type: rich-text
                    required: true
                    options:
                      format: markdown
                      switcher: true
                      media: images
                      rename: safe
                      categories: [image]
              - name: key_points
                label: Key points
                fields:
                  - name: heading
                    label: Heading
                    type: string
                    default: Key points
                    options:
                      maxlength: 160
                  - name: items
                    label: Points
                    type: string
                    required: true
                    list:
                      min: 1
                      max: 12
                    options:
                      maxlength: 300
              - name: pull_quote
                label: Pull quote
                fields:
                  - name: quote
                    label: Quotation
                    type: text
                    required: true
                    options:
                      maxlength: 500
                  - name: attribution
                    label: Attribution
                    type: string
                    options:
                      maxlength: 160
              - name: fact_box
                label: Fact box
                fields:
                  - name: heading
                    label: Heading
                    type: string
                    required: true
                    options:
                      maxlength: 160
                  - name: body
                    label: Facts and context
                    type: rich-text
                    required: true
                    options:
                      format: markdown
                      switcher: true
              - name: image
                label: Image with caption
                fields:
                  - name: heading
                    label: Internal section label
                    type: string
                    description: "Optional. Used only for document structure and screen readers."
                    options:
                      maxlength: 160
                  - name: src
                    label: Image
                    type: image
                    required: true
                    options:
                      media: images
                      extensions: [avif, gif, jpeg, jpg, png, svg, webp]
                      categories: [image]
                      rename: safe
                  - name: alt
                    label: Image description
                    type: string
                    description: "Describe meaningful visual content. Leave empty only when Decorative image is enabled."
                    options:
                      maxlength: 240
                  - name: decorative
                    label: Decorative image
                    type: boolean
                    default: false
                  - name: caption
                    label: Caption
                    type: text
                    options:
                      maxlength: 300
                  - name: credit
                    label: Photographer or source credit
                    type: string
                    options:
                      maxlength: 160
                  - name: rights
                    label: Rights or usage note
                    type: string
                    options:
                      maxlength: 300
                  - name: layout
                    label: Page width
                    type: select
                    default: standard
                    options:
                      values:
                        - name: standard
                          label: Standard article width
                        - name: wide
                          label: Wide
                        - name: full
                          label: Full page width
                        - name: left
                          label: Float left on large screens
                        - name: right
                          label: Float right on large screens
                  - name: aspect
                    label: Image shape
                    type: select
                    default: original
                    options:
                      values: [original, landscape, portrait, square]
                  - name: focal_point
                    label: Important image area
                    type: select
                    default: center
                    options:
                      values: [center, top, bottom, left, right]
                  - name: lightbox
                    label: Allow larger image viewer
                    type: boolean
                    default: true
              - name: gallery
                label: Accessible image gallery
                fields:
                  - name: heading
                    label: Gallery heading
                    type: string
                    default: Photo gallery
                    options:
                      maxlength: 160
                  - name: description
                    label: Gallery introduction
                    type: text
                    options:
                      maxlength: 500
                  - name: items
                    label: Gallery images
                    type: object
                    required: true
                    list:
                      min: 2
                      max: 12
                      collapsible:
                        collapsed: true
                        summary: "{caption} · image {index}"
                    fields:
                      - name: src
                        label: Image
                        type: image
                        required: true
                        options:
                          media: images
                          extensions: [avif, gif, jpeg, jpg, png, svg, webp]
                          categories: [image]
                          rename: safe
                      - name: alt
                        label: Image description
                        type: string
                        options:
                          maxlength: 240
                      - name: decorative
                        label: Decorative image
                        type: boolean
                        default: false
                      - name: caption
                        label: Caption
                        type: text
                        options:
                          maxlength: 300
                      - name: credit
                        label: Photographer or source credit
                        type: string
                        options:
                          maxlength: 160
                      - name: rights
                        label: Rights or usage note
                        type: string
                        options:
                          maxlength: 300
                      - name: aspect
                        label: Image shape
                        type: select
                        default: landscape
                        options:
                          values: [original, landscape, portrait, square]
                      - name: focal_point
                        label: Important image area
                        type: select
                        default: center
                        options:
                          values: [center, top, bottom, left, right]
              - name: timeline
                label: Timeline
                fields:
                  - name: heading
                    label: Timeline heading
                    type: string
                    default: Timeline
                    options:
                      maxlength: 160
                  - name: items
                    label: Timeline entries
                    type: object
                    required: true
                    list:
                      min: 1
                      max: 20
                      collapsible:
                        collapsed: true
                        summary: "{date} · {title}"
                    fields:
                      - name: date
                        label: Date or time label
                        type: string
                        options:
                          maxlength: 80
                      - name: title
                        label: Entry title
                        type: string
                        required: true
                        options:
                          maxlength: 180
                      - name: body
                        label: Entry detail
                        type: rich-text
                        options:
                          format: markdown
                          switcher: true
              - name: callout
                label: Callout or editor note
                fields:
                  - name: tone
                    label: Style
                    type: select
                    default: neutral
                    options:
                      values:
                        - name: neutral
                          label: Neutral note
                        - name: note
                          label: Editor note
                        - name: important
                          label: Important notice
                        - name: context
                          label: Background context
                  - name: heading
                    label: Heading
                    type: string
                    required: true
                    options:
                      maxlength: 160
                  - name: body
                    label: Callout text
                    type: rich-text
                    required: true
                    options:
                      format: markdown
                      switcher: true
              - name: document
                label: Supporting document card
                fields:
                  - name: heading
                    label: Document title
                    type: string
                    required: true
                    options:
                      maxlength: 180
                  - name: url
                    label: Document path or URL
                    type: string
                    required: true
                    description: "Use a repository path beginning with / or a complete https:// address."
                    options:
                      maxlength: 2048
                  - name: label
                    label: Button label
                    type: string
                    default: Open document
                    options:
                      maxlength: 100
                  - name: description
                    label: Reader-facing description
                    type: text
                    options:
                      maxlength: 600
              - name: numbered_findings
                label: Numbered findings
                fields:
                  - name: heading
                    label: Heading
                    type: string
                    default: Findings
                  - name: items
                    label: Findings
                    type: string
                    required: true
                    list:
                      min: 1
                      max: 30
              - name: source_list
                label: Source list
                fields:
                  - name: heading
                    label: Heading
                    type: string
                    default: Sources
                  - name: items
                    label: Sources
                    type: string
                    required: true
                    list:
                      min: 1
                      max: 30
              - name: data_table
                label: Accessible data table
                fields:
                  - name: heading
                    label: Table heading
                    type: string
                    default: Data table
                  - name: description
                    label: What this table shows
                    type: text
                  - name: columns
                    label: Column labels
                    type: string
                    required: true
                    list:
                      min: 1
                      max: 12
                  - name: rows
                    label: Rows
                    type: string
                    required: true
                    description: "One row per entry. Separate cells with | in the same order as the columns."
                    list:
                      min: 1
                      max: 100
              - name: correction_notice
                label: Correction notice
                fields:
                  - name: heading
                    label: Heading
                    type: string
                    default: Correction
                  - name: body
                    label: Correction text
                    type: rich-text
                    required: true
                    options: { format: markdown, switcher: true }
              - name: update_notice
                label: Update notice
                fields:
                  - name: heading
                    label: Heading
                    type: string
                    default: Update
                  - name: body
                    label: Update text
                    type: rich-text
                    required: true
                    options: { format: markdown, switcher: true }
              - name: related_coverage
                label: Related coverage list
                fields:
                  - name: heading
                    label: Heading
                    type: string
                    default: Related coverage
                  - name: items
                    label: Coverage links or notes
                    type: string
                    required: true
                    list:
                      min: 1
                      max: 30
              - name: editor_note
                label: Editor’s note
                fields:
                  - name: heading
                    label: Heading
                    type: string
                    default: Editor’s note
                  - name: body
                    label: Note
                    type: rich-text
                    required: true
                    options: { format: markdown, switcher: true }
              - name: definition_box
                label: Definition or background box
                fields:
                  - name: heading
                    label: Heading
                    type: string
                    default: Background
                  - name: body
                    label: Definition or background
                    type: rich-text
                    required: true
                    options: { format: markdown, switcher: true }
              - name: methodology_box
                label: Methodology box
                fields:
                  - name: heading
                    label: Heading
                    type: string
                    default: Methodology
                  - name: body
                    label: Methodology
                    type: rich-text
                    required: true
                    options: { format: markdown, switcher: true }
          - name: author
            label: Author or contributor
            type: reference
            description: "Required before publishing. Add contributors under Publication data when they are not listed."
            options:
              collection: authors
              search: "name,role,slug"
              value: "{fields.slug}"
              label: "{fields.name}"
          - name: categories
            label: Categories
            type: reference
            description: "Required before publishing. Select one to five broad archive categories."
            options:
              collection: categories
              multiple: true
              min: 1
              max: 5
              search: "name,description,slug"
              value: "{fields.slug}"
              label: "{fields.name}"
          - name: hub
            label: Coverage hub
            type: reference
            description: "Optional recurring beat, region, project, organization, or case-file grouping."
            options:
              collection: hubs
              search: "name,region,description,slug"
              value: "{fields.slug}"
              label: "{fields.name}"
          - name: tags
            label: Topic tags
            type: string
            description: "Optional specific topics. Keep tags short and reusable."
            list:
              max: 20
            options:
              maxlength: 60
          - name: published_at
            label: Publication date and time
            type: date
            description: "Required before publishing. Drafts may leave this empty."
            options:
              time: true
              format: "yyyy-MM-dd'T'HH:mm:ssXXX"
          - name: updated_at
            label: Last updated
            type: date
            description: "Optional. Use only for a meaningful public update and never earlier than the publication time."
            options:
              time: true
              format: "yyyy-MM-dd'T'HH:mm:ssXXX"
          - name: featured
            label: Feature on homepage
            type: boolean
            default: false
            description: "Use sparingly. When several articles are featured, the newest published one becomes the homepage feature."
          - name: featured_image
            label: Featured image
            type: image
            description: "Optional article card and page image. Prepare and compress it at /media-desk/ when useful, then add a meaningful description in the next field."
            options:
              media: images
              extensions: [avif, gif, jpeg, jpg, png, svg, webp]
              categories: [image]
              rename: safe
          - name: featured_image_alt
            label: Featured image description
            type: string
            description: "Required whenever a featured image is used. Describe the meaningful visual content; do not begin with Image of."
            options:
              maxlength: 240
          - name: featured_image_caption
            label: Featured image caption
            type: text
            options:
              maxlength: 300
          - name: featured_image_credit
            label: Featured image credit
            type: string
            options:
              maxlength: 160
          - name: featured_image_rights
            label: Featured image rights note
            type: string
            description: "Optional internal/public rights context, such as Courtesy of or used with permission."
            options:
              maxlength: 300
          - name: featured_image_aspect
            label: Featured image shape
            type: select
            default: landscape
            options:
              values:
                - name: original
                  label: Original proportions
                - name: landscape
                  label: Newspaper landscape
                - name: portrait
                  label: Portrait
                - name: square
                  label: Square
          - name: featured_image_focal_point
            label: Important image area
            type: select
            default: center
            description: "Keeps the important part visible when the image is cropped."
            options:
              values: [center, top, bottom, left, right]
          - name: pdf_file
            label: Upload a local PDF
            type: file
            description: "Use for PDF-first or mixed articles when the file belongs in this repository. Cloudflare Pages currently limits individual deployed files to 25 MiB."
            options:
              media: documents
              extensions: [pdf]
              categories: [document]
              rename: safe
          - name: pdf_url
            label: External document URL
            type: string
            description: "Use a complete https:// address when the document must remain elsewhere. For an External document article, this is required and the local PDF field must stay empty."
            pattern:
              regex: "^$|^https?://.+$"
              message: "Use a complete http:// or https:// address, or leave the field empty."
            options:
              maxlength: 2048
          - name: pdf_title
            label: Document title
            type: string
            description: "Required before publishing PDF-first, mixed, and external-document articles."
            options:
              maxlength: 180
          - name: document_description
            label: Document description
            type: text
            description: "Required before publishing PDF-first, mixed, and external-document articles. Explain what the document is and why it is included in at least one clear sentence."
            options:
              minlength: 20
              maxlength: 600
          - name: document_accessible_summary
            label: Accessible HTML document summary
            type: rich-text
            description: "Required before publishing a document article. Summarize the document's essential meaning, context, and key information so readers do not have to rely on the embedded PDF viewer."
            options:
              format: markdown
              switcher: true
          - name: document_accessibility_note
            label: Document accessibility note
            type: text
            description: "Optional. Explain any known limitations, remediation status, transcript availability, or alternative access path."
            options:
              maxlength: 600
          - name: document_date
            label: Document date
            type: date
            description: "Optional date printed on or associated with the source document."
          - name: document_pages
            label: Number of pages
            type: number
            default: 0
            description: "Optional. Use 0 when unknown."
            options:
              min: 0
              step: 1
          - name: document_source
            label: Document source
            type: string
            description: "Optional agency, court, organization, person, archive, or other source."
            options:
              maxlength: 180
          - name: external_link_label
            label: External link button text
            type: string
            description: "Optional button label for externally hosted documents."
            options:
              maxlength: 100
          - name: allow_download
            label: Show local PDF download button
            type: boolean
            default: true
            description: "Applies to repository-hosted PDFs. The original file can still be opened directly."
          - name: pdf_viewer_default
            label: Default PDF view
            type: select
            default: fit-width
            description: "Applies to PDF-first and mixed articles. Readers can change the view."
            options:
              values:
                - name: fit-width
                  label: Fit page width
                - name: fit-page
                  label: Fit whole page
          - name: show_author_bio
            label: Show contributor biography
            type: boolean
            default: true
          - name: series_slug
            label: Series URL slug
            type: string
            description: "Optional. Use the same lowercase slug on every article in a series. Leave all series fields empty for a standalone article."
            pattern:
              regex: "^$|^[a-z0-9]+(?:-[a-z0-9]+)*$"
              message: "Use lowercase letters, numbers, and single hyphens only."
            options:
              maxlength: 120
          - name: series_title
            label: Series title
            type: string
            description: "Optional. Must match across every article using the same series slug."
            options:
              maxlength: 180
          - name: series_description
            label: Series description
            type: text
            description: "Optional plain-language introduction for the generated series front."
            options:
              maxlength: 360
          - name: series_order
            label: Order within series
            type: number
            description: "Required when a series is selected. Use 1 for the first installment, 2 for the next, and so on."
            options:
              min: 1
              max: 999
              step: 1
          - name: related_articles
            label: Related article slugs
            type: string
            description: "Optional. Add the permanent slugs of other articles readers should see next."
            list:
              max: 12
            pattern:
              regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              message: "Use an existing article slug."
            options:
              maxlength: 120
          - name: methodology
            label: Reporting methodology
            type: rich-text
            description: "Optional. Explain records reviewed, interviews, data methods, verification steps, or limits."
            options:
              format: markdown
              switcher: true
          - name: disclosure
            label: Disclosure or context note
            type: rich-text
            description: "Optional. Disclose relationships, funding, conflicts, AI assistance, or other context readers should know."
            options:
              format: markdown
              switcher: true
          - name: rights_and_reuse
            label: Rights and reuse statement
            type: text
            description: "Optional article-specific copyright, quotation, or republication guidance."
            options:
              maxlength: 1000
          - name: what_changed
            label: What changed
            type: text
            description: "Optional short summary shown near the top when a meaningful update has been made."
            options:
              maxlength: 1000
          - name: update_history
            label: Update history
            type: object
            description: "Optional material update log. Newest entries are displayed first."
            list:
              max: 25
              collapsible:
                collapsed: true
                summary: "{date} · {title}"
            fields:
              - name: date
                label: Update date and time
                type: date
                required: true
                options:
                  time: true
              - name: title
                label: Update heading
                type: string
                options:
                  maxlength: 160
              - name: body
                label: What changed
                type: text
                required: true
                options:
                  maxlength: 1000
          - name: corrections
            label: Corrections
            type: object
            description: "Optional corrections record. Explain the original error and the corrected information clearly."
            list:
              max: 25
              collapsible:
                collapsed: true
                summary: "{date} · {title}"
            fields:
              - name: date
                label: Correction date and time
                type: date
                required: true
                options:
                  time: true
              - name: title
                label: Correction heading
                type: string
                options:
                  maxlength: 160
              - name: body
                label: Correction note
                type: text
                required: true
                options:
                  maxlength: 1000
          - name: source_links
            label: Sources and related links
            type: object
            description: "Optional public references. Add a clear label and a site-relative or https:// URL."
            list:
              max: 30
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Link label
                type: string
                required: true
                options:
                  maxlength: 160
              - name: url
                label: URL
                type: string
                required: true
                pattern:
                  regex: "^(?:/|https?://).+$"
                  message: "Use a site-relative path beginning with / or a complete http(s) URL."
                options:
                  maxlength: 2048
              - name: note
                label: Reader note
                type: text
                options:
                  maxlength: 500
          - name: seo_title
            label: SEO title override
            type: string
            description: "Optional. Leave empty to use the headline. Aim for 70 characters or fewer."
            options:
              maxlength: 70
          - name: seo_description
            label: SEO description override
            type: text
            description: "Optional. Leave empty to use the article summary. Aim for 170 characters or fewer."
            options:
              maxlength: 170
          - name: canonical_url
            label: Canonical URL override
            type: string
            description: "Advanced. Usually leave empty. Use only when another absolute URL is the preferred original."
            pattern:
              regex: "^$|^https?://.+$"
              message: "Use a complete http:// or https:// address, or leave the field empty."
            options:
              maxlength: 2048
          - name: legacy_urls
            label: Previous article URLs
            type: string
            description: "Optional old paths or complete former URLs that should permanently redirect to this article. Do not include query strings or fragments."
            list:
              max: 30
            pattern:
              regex: "^(?:/|https?://).+$"
              message: "Use a path beginning with / or a complete http(s) URL."
            options:
              maxlength: 900
          - name: noindex
            label: Hide from search engines
            type: boolean
            default: false
            description: "Advanced. This does not make a published page private; it only asks search engines not to index it."
          - name: review_content
            label: Content and sources reviewed
            type: boolean
            default: false
            description: "Required for Published status. Confirm the public text, dates, names, links, and source descriptions have been reviewed."
          - name: review_rights
            label: Rights and private information reviewed
            type: boolean
            default: false
            description: "Required for Published status. Confirm the publication may share the text, images, and files and that unintended private information has been removed."
          - name: review_accessibility
            label: Reader access reviewed
            type: boolean
            default: false
            description: "Required for Published status. Confirm image descriptions, PDF title, direct document links, and mobile reading fallbacks are appropriate."
          - name: editor_notes
            label: Private editor notes
            type: text
            description: "Optional internal notes stored in Git. The site generator never renders this field publicly."
            options:
              maxlength: 2000

  - name: newsroom
    label: Publication data
    type: group
    items:
      - name: authors
        label: Authors
        type: collection
        path: content/authors
        format: json
        subfolders: false
        filename:
          template: "{fields.slug}.json"
          field: false
        view:
          primary: name
          fields: [role, active]
          search: [name, role, slug]
          sort: [name, role]
          default:
            sort: name
            order: asc
        fields:
          - name: name
            label: Display name
            type: string
            required: true
            options:
              maxlength: 120
          - name: slug
            component: slug
            description: "Stable internal author identifier. Changing it requires updating article references."
          - name: role
            label: Role or title
            type: string
            options:
              maxlength: 120
          - name: bio
            label: Public biography
            type: text
            options:
              maxlength: 1200
          - name: avatar
            label: Portrait or mark
            type: image
            options:
              media: images
              extensions: [avif, gif, jpeg, jpg, png, svg, webp]
              categories: [image]
              rename: safe
          - name: active
            label: Active contributor
            type: boolean
            default: true
      - name: categories
        label: Categories
        type: collection
        path: content/categories
        format: json
        subfolders: false
        filename:
          template: "{fields.slug}.json"
          field: false
        view:
          primary: name
          fields: [slug]
          search: [name, description, slug]
          sort: [name]
          default:
            sort: name
            order: asc
        fields:
          - name: name
            label: Category name
            type: string
            required: true
            options:
              maxlength: 100
          - name: slug
            component: slug
            description: "Stable category identifier used by articles."
          - name: description
            label: Public description
            type: text
            options:
              maxlength: 500
      - name: hubs
        label: Coverage hubs
        type: collection
        path: content/hubs
        format: json
        subfolders: false
        filename:
          template: "{fields.slug}.json"
          field: false
        view:
          primary: name
          fields: [region, active]
          search: [name, region, description, slug]
          sort: [name, region]
          default:
            sort: name
            order: asc
        fields:
          - name: name
            label: Hub name
            type: string
            required: true
            options:
              maxlength: 120
          - name: slug
            component: slug
            description: "Stable hub identifier used by articles."
          - name: region
            label: Region or beat label
            type: string
            options:
              maxlength: 120
          - name: description
            label: Public description
            type: text
            options:
              maxlength: 700
          - name: active
            label: Show hub publicly
            type: boolean
            default: true

  - name: settings_group
    label: Site settings
    type: group
    items:
      - name: site
        label: Quick setup & publication settings
        type: file
        path: content/site.json
        format: json
        fields:
          - name: title
            label: Publication name
            type: string
            required: true
            options:
              maxlength: 100
          - name: short_title
            label: Short publication name
            type: string
            description: "Optional. TAHAI Press uses the publication name automatically when this is blank; it is used in browser titles when the full name is too long."
            options:
              maxlength: 60
          - name: brand_mark
            label: Brand mark letters
            type: string
            description: "Optional. One or two letters used when no logo is uploaded; initials are generated from the publication name when blank."
            pattern:
              regex: "^[A-Za-z0-9]{1,2}$"
              message: "Use one or two letters or numbers."
            options:
              maxlength: 2
          - name: tagline
            type: string
            required: true
            options:
              maxlength: 140
          - name: masthead_kicker
            label: Top bar text
            type: string
            required: true
            options:
              maxlength: 160
          - name: standards_label
            label: Top bar link label
            type: string
            options:
              maxlength: 80
          - name: hero_kicker
            label: Homepage eyebrow
            type: string
            options:
              maxlength: 120
          - name: hero_title
            label: Homepage headline
            type: string
            required: true
            options:
              maxlength: 180
          - name: hero_description
            label: Homepage introduction
            type: text
            required: true
            options:
              maxlength: 600
          - name: editorial_promise
            label: Publication promise
            type: text
            required: true
            options:
              maxlength: 500
          - name: navigation_note
            label: Navigation note
            type: string
            options:
              maxlength: 120
          - name: description
            label: Site description
            type: text
            required: true
            options:
              maxlength: 500
          - name: template_mode
            label: TAHAI Press demo mode
            type: boolean
            required: true
            default: true
            description: "Keep enabled for the branded first-deploy demonstration. Disable only after replacing the sample publication identity, email, content, URLs, and media. Visible TAHAI Press repository credit is removed from publisher pages when this is off."
          - name: site_url
            label: Production site URL
            type: string
            required: true
            description: "Complete HTTPS public origin with no trailing path, such as https://example.pages.dev."
            pattern:
              regex: "^https://[^/]+/?$"
              message: "Use a complete https:// origin without a path."
            options:
              maxlength: 2048
          - name: locale
            type: string
            required: true
            description: "BCP 47 locale used for date formatting, such as en-US."
            options:
              maxlength: 40
          - name: timezone
            type: string
            required: true
            description: "IANA time zone, such as America/New_York."
            options:
              maxlength: 80
          - name: editor_email
            label: Editor email
            type: string
            required: true
            pattern:
              regex: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
              message: "Enter a valid email address."
            options:
              maxlength: 254
          - name: submit_story_url
            label: Submission URL
            type: string
            description: "Site-relative path or complete http(s) URL."
            options:
              maxlength: 2048
          - name: contact_url
            label: Contact URL
            type: string
            description: "Site-relative path or complete http(s) URL."
            options:
              maxlength: 2048
          - name: footer_note
            label: Footer note
            type: string
            options:
              maxlength: 240
          - name: logo
            type: image
            options:
              media: images
              extensions: [avif, gif, jpeg, jpg, png, svg, webp]
              categories: [image]
              rename: safe
          - name: default_social_image
            label: Default social image
            type: image
            options:
              media: images
              extensions: [avif, gif, jpeg, jpg, png, webp]
              categories: [image]
              rename: safe
          - name: default_social_image_alt
            label: Default social image description
            type: string
            description: "Required when a default social image is configured. Describe the publication image for social previews."
            options:
              maxlength: 240
          - name: accessibility
            label: Accessibility statement
            type: object
            required: true
            description: "Controls the publisher-facing accessibility page and feedback address. TAHAI Press does not add visible platform branding."
            fields:
              - name: statement_enabled
                label: Publish accessibility page
                type: boolean
                required: true
                default: true
              - name: contact_email
                label: Accessibility feedback email
                type: string
                description: "Leave blank to use the main editor email."
                pattern:
                  regex: "^$|^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
                  message: "Enter a valid email address or leave this blank."
                options:
                  maxlength: 254
              - name: statement_intro
                label: Accessibility commitment
                type: text
                description: "Plain-language introduction displayed on the accessibility page."
                options:
                  maxlength: 900
              - name: feedback_note
                label: Barrier-reporting guidance
                type: text
                description: "Tell readers what information will help the publisher investigate an accessibility problem."
                options:
                  maxlength: 700
              - name: reader_tools_enabled
                label: Show reader preference tools
                type: boolean
                default: true
                description: "Adds local text-size, spacing, reading-width, surface, link, and motion controls. Preferences stay in the reader's browser."
              - name: simplified_reading_enabled
                label: Generate simplified article views
                type: boolean
                default: true
                description: "Creates a distraction-reduced, noindex reading route for every published article."
              - name: default_link_underlines
                label: Underline links by default
                type: boolean
                default: false
              - name: document_summary_required
                label: Require accessible HTML summaries for document articles
                type: boolean
                default: true
                description: "Recommended. Prevents publication of PDF-first, mixed, or external-document articles without a meaningful HTML alternative."
          - name: reader_reach
            label: Reader Reach
            type: object
            required: true
            description: "Optional static reader conveniences. Saved lists and preferences remain in each reader's browser; no reader account, database, or analytics service is created."
            fields:
              - name: enabled
                label: Enable Reader Reach
                type: boolean
                required: true
                default: true
              - name: offline_enabled
                label: Cache recent pages for offline reading
                type: boolean
                required: true
                default: true
                description: "Generates a same-origin service worker and installable web app manifest."
              - name: saved_articles_enabled
                label: Let readers save stories on this device
                type: boolean
                required: true
                default: true
              - name: browser_share_enabled
                label: Add browser sharing and copy-link fallback
                type: boolean
                required: true
                default: true
              - name: current_edition_enabled
                label: Generate a printable current edition
                type: boolean
                required: true
                default: true
              - name: current_edition_count
                label: Stories in the current edition
                type: number
                required: true
                default: 8
                options:
                  min: 1
                  max: 50
                  step: 1
              - name: offline_article_count
                label: Recent stories cached for offline reading
                type: number
                required: true
                default: 12
                options:
                  min: 1
                  max: 50
                  step: 1
          - name: discovery
            label: Search and archive settings
            type: object
            required: true
            description: "Controls static archive pagination and the maximum number of browser search results."
            fields:
              - name: archive_page_size
                label: Entries per archive page
                type: number
                required: true
                default: 12
                options:
                  min: 1
                  max: 100
                  step: 1
              - name: search_result_limit
                label: Maximum search results
                type: number
                required: true
                default: 50
                options:
                  min: 1
                  max: 100
                  step: 1
          - name: theme_preset
            label: Accessible newspaper theme
            type: select
            required: true
            default: classic-broadsheet
            description: "Choose a tested preset. Select Custom only when an experienced maintainer needs the advanced color fields below."
            options:
              values:
                - name: classic-broadsheet
                  label: Classic Broadsheet
                - name: community-weekly
                  label: Community Weekly
                - name: civic-record
                  label: Civic Record
                - name: modern-daily
                  label: Modern Daily
                - name: investigative-journal
                  label: Investigative Journal
                - name: arts-culture
                  label: Arts & Culture
                - name: high-contrast
                  label: High Contrast
                - name: warm-reading
                  label: Warm Reading Edition
                - name: custom
                  label: Custom — use advanced colors below
          - name: layout
            label: Reading and layout preset
            type: object
            required: true
            description: "A small set of safe presentation choices. Recommended defaults are Balanced, Standard, Centered, Serif, Square, and Paper."
            fields:
              - name: density
                label: Page density
                type: select
                required: true
                default: balanced
                options:
                  values:
                    - name: compact
                      label: Compact
                    - name: balanced
                      label: Balanced
                    - name: spacious
                      label: Spacious
              - name: reading_width
                label: Article reading width
                type: select
                required: true
                default: standard
                options:
                  values:
                    - name: narrow
                      label: Narrow
                    - name: standard
                      label: Standard
                    - name: wide
                      label: Wide
              - name: masthead_alignment
                label: Masthead alignment
                type: select
                required: true
                default: center
                options:
                  values:
                    - name: center
                      label: Centered
                    - name: left
                      label: Left aligned
              - name: headline_style
                label: Headline style
                type: select
                required: true
                default: serif
                options:
                  values:
                    - name: serif
                      label: Newspaper serif
                    - name: sans
                      label: Modern sans serif
              - name: panel_style
                label: Panel corners
                type: select
                required: true
                default: square
                options:
                  values:
                    - name: square
                      label: Square
                    - name: soft
                      label: Soft
              - name: reader_surface
                label: Default reading surface
                type: select
                required: true
                default: paper
                options:
                  values:
                    - name: paper
                      label: Paper
                    - name: light
                      label: Light
                    - name: sepia
                      label: Sepia
          - name: navigation
            label: Main navigation
            type: object
            required: true
            description: "Add, remove, rename, and reorder menu links. Use site paths beginning with / or complete https:// links."
            fields:
              - name: note
                label: Short navigation note
                type: string
                options:
                  maxlength: 120
              - name: items
                label: Menu links
                type: object
                list:
                  max: 12
                  collapsible:
                    collapsed: true
                    summary: "{label} → {href}"
                fields:
                  - name: label
                    label: Link label
                    type: string
                    required: true
                    options:
                      maxlength: 80
                  - name: href
                    label: Destination
                    type: string
                    required: true
                    pattern:
                      regex: "^(?:/|https://).+$"
                      message: "Use a site path beginning with / or a complete https:// URL."
                    options:
                      maxlength: 2048
          - name: homepage
            label: Homepage sections
            type: object
            required: true
            description: "Enable and reorder the sections that belong on the front page. Demo-only sections disappear automatically when demo mode is off."
            fields:
              - name: modules
                label: Section order
                type: object
                list:
                  max: 12
                  collapsible:
                    collapsed: true
                    summary: "{type}"
                fields:
                  - name: type
                    label: Section type
                    type: select
                    required: true
                    options:
                      values:
                        - name: intro
                          label: Homepage introduction
                        - name: setup
                          label: Guided setup panel — demo only
                        - name: license
                          label: License explanation — demo only
                        - name: featured
                          label: Featured story
                        - name: latest
                          label: Latest stories
                        - name: reach
                          label: Reader Reach
                        - name: studio
                          label: Editorial Studio composer
                        - name: product
                          label: TAHAI Press project panel — demo only
                        - name: pillars
                          label: Publishing pillars
                        - name: hubs
                          label: Coverage hubs
                        - name: submit
                          label: Submission callout
                  - name: enabled
                    label: Show this section
                    type: boolean
                    default: true
                  - name: heading
                    label: Optional custom heading
                    type: string
                    options:
                      maxlength: 120
                  - name: count
                    label: Maximum items
                    type: number
                    description: "Used by Latest stories and Coverage hubs."
                    options:
                      min: 1
                      max: 24
                      step: 1
          - name: theme
            label: Advanced custom colors
            type: object
            required: true
            description: "Use six-digit hex colors. The build rejects combinations that fail required text, button, or control contrast thresholds."
            fields:
              - name: brand
                label: Brand color
                component: hex_color
                required: true
              - name: brand_deep
                label: Deep brand color
                component: hex_color
                required: true
              - name: brand_soft
                label: Soft brand color
                component: hex_color
                required: true
              - name: accent
                label: Accent color
                component: hex_color
                required: true
              - name: accent_dark
                label: Dark accent color
                component: hex_color
                required: true
              - name: highlight
                label: Highlight color
                component: hex_color
                required: true
              - name: surface
                label: Surface color
                component: hex_color
                required: true
              - name: surface_deep
                label: Deep surface color
                component: hex_color
                required: true
              - name: paper
                label: Page color
                component: hex_color
                required: true
      - name: crosswords
        label: Crossword desk
        type: collection
        path: content/crosswords
        format: json
        subfolders: false
        filename:
          template: "{fields.slug}.json"
          field: false
        view:
          primary: title
          fields: [difficulty, active, rotation_order]
          search: [title, slug, deck]
          sort: [difficulty, rotation_order, title]
        fields:
          - name: title
            label: Puzzle title
            type: string
            required: true
            options:
              maxlength: 120
          - name: slug
            component: slug
          - name: difficulty
            label: Difficulty
            type: select
            required: true
            default: novice
            options:
              values:
                - name: novice
                  label: Novice mini — 5 by 5
                - name: expert
                  label: Expert — blocked grid
          - name: deck
            label: Short description
            type: text
            required: true
            options:
              maxlength: 300
          - name: active
            label: Include in rotation
            type: boolean
            default: true
          - name: rotation_order
            label: Rotation order
            type: number
            required: true
            description: "Use a unique positive number within each difficulty. Lower numbers appear first when browsing alternate editions."
            options:
              min: 1
              max: 999
              step: 1
          - name: grid
            label: Grid rows
            type: string
            required: true
            description: "Enter one row per item. Use uppercase letters for open squares and # for black squares. Every row must have the same length as the number of rows."
            list:
              min: 5
              max: 21
            pattern:
              regex: "^[A-Z#]+$"
              message: "Use uppercase A-Z letters and # black squares only."
          - name: clues
            label: Clues
            type: object
            required: true
            list:
              min: 1
              max: 200
              collapsible:
                collapsed: true
                summary: "{direction} · {answer} · {clue}"
            fields:
              - name: direction
                label: Direction
                type: select
                required: true
                options:
                  values:
                    - name: across
                      label: Across
                    - name: down
                      label: Down
              - name: answer
                label: Answer
                type: string
                required: true
                pattern:
                  regex: "^[A-Z]+$"
                  message: "Use uppercase A-Z letters only."
                options:
                  maxlength: 30
              - name: clue
                label: Clue text
                type: text
                required: true
                options:
                  maxlength: 300
      - name: redirects
        label: Manual redirects
        type: file
        path: content/redirects.json
        format: json
        fields:
          - name: redirects
            label: Redirect rules
            type: object
            description: "Optional static aliases for retired pages. Article-specific previous URLs belong on the article itself."
            list:
              max: 2000
              collapsible:
                collapsed: true
                summary: "{from} → {to}"
            fields:
              - name: from
                label: Previous path or URL
                type: string
                required: true
                description: "Use a path beginning with / or a complete former URL. Query strings, fragments, wildcards, and placeholders are rejected."
                pattern:
                  regex: "^(?:/|https?://).+$"
                  message: "Use a path beginning with / or a complete http(s) URL."
                options:
                  maxlength: 900
              - name: to
                label: Final destination
                type: string
                required: true
                description: "Usually a current site path beginning with /. External http(s) destinations are also supported."
                pattern:
                  regex: "^(?:/|https?://).+$"
                  message: "Use a path beginning with / or a complete http(s) URL."
                options:
                  maxlength: 900
              - name: status
                label: Redirect status
                type: select
                required: true
                default: 301
                options:
                  values:
                    - name: 301
                      label: 301 — permanent
                    - name: 302
                      label: 302 — temporary
                    - name: 303
                      label: 303 — see other
                    - name: 307
                      label: 307 — temporary, preserve method
                    - name: 308
                      label: 308 — permanent, preserve method
              - name: preserve_query_string
                label: Preserve query string in Bulk Redirect export
                type: boolean
                default: true
                description: "Applies to the optional Cloudflare Bulk Redirect CSV export. Pages _redirects rules do not expose this switch."
              - name: note
                label: Private maintenance note
                type: text
                options:
                  maxlength: 500
